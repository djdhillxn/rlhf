experiment:
  id: qwen25-05b-helpsteer3-trl-dpo-h100-full
  name: Qwen2.5 0.5B HelpSteer3 TRL DPO full run
  group: qwen25-05b-helpsteer3-trl
  tags: [trl, dpo, lora, context-4096, h100-full]
  hypothesis: Offline DPO can learn HelpSteer3 preferences without the reward-model exploitation and rollout instability observed under PPO.
  parent_runs: [qwen25-05b-helpsteer3-trl-sft-a100-full]

model:
  sft_model_path: outputs/trl/qwen25_05b_helpsteer3_sft_a100_full/final_merged_model
  dtype: bfloat16
  trust_remote_code: false
  attn_implementation: sdpa

data:
  cache_dir: outputs/trl/data/helpsteer3_qwen25_05b_4096
  stages: [dpo]
  splits: [train, validation]
  train_split: train
  eval_split: validation
  max_total_length: 4096
  max_prompt_length: 3072
  max_train_samples: null
  max_validation_samples: null
  max_eval_samples: null
  # HelpSteer3 levels 1/2/3 are ordinal. Keep one row per pair for the primary
  # DPO result; linear_replication is available as a separately named ablation.
  preference_strength_weighting: none

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

dpo:
  beta: 0.1
  loss_type: sigmoid
  label_smoothing: 0.0
  # Data preparation already preserves complete chosen/rejected responses.
  # None prevents the trainer from applying a second, response-cutting truncation.
  max_length: null
  truncation_mode: keep_start
  disable_dropout: true
  dataset_num_proc: 4
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 8
  padding_free: false

train:
  output_dir: outputs/trl/qwen25_05b_helpsteer3_dpo_h100_full
  run_name: qwen25-05b-helpsteer3-trl-dpo-h100-full
  seed: 839
  data_seed: 839
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 1
  learning_rate: 5.0e-6
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  optim: adamw_torch_fused
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  logging_steps: 10
  logging_first_step: true
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 3
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  remove_unused_columns: true
  report_to: none
  resume_from_checkpoint: auto
  checkpoint_sync_dir: null
  final_sync_dir: null
